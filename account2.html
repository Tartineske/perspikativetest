<!DOCTYPE html>
<html>
<head>
    <title>My Firebase Auth App</title>
    <!-- Firebase SDKs - ALWAYS include firebase-app.js first -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>
    <h1>Welcome to My App!</h1>
    <div id="message">No user signed in.</div>

    <!-- Sign Up Form -->
    <h2>Sign Up</h2>
    <input type="email" id="signupEmail" placeholder="Email">
    <input type="password" id="signupPassword" placeholder="Password">
    <button id="signupButton">Sign Up</button>

    <!-- Sign In Form -->
    <h2>Sign In</h2>
    <input type="email" id="signinEmail" placeholder="Email">
    <input type="password" id="signinPassword" placeholder="Password">
    <button id="signinButton">Sign In</button>
    <button id="googleSigninButton">Sign In with Google</button>
    <button id="signOutButton">Sign Out</button>

    <script>
        // Your Firebase project configuration
        const firebaseConfig = {
            apiKey: "1:520735354440:web:3607aac59cf6f30c97727d", // Replace with your actual API Key
            authDomain: "perspikative-26800.firebaseapp.com",
            projectId: "perspikative-26800",
            storageBucket: "perspikative-26800.appspot.com",
            messagingSenderId: "520735354440",
            appId: "perspikative-26800" // Replace with your actual App ID
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // Get the Auth instance
        const auth = firebase.auth();
        const messageElement = document.getElementById("message");

        // Listen for authentication state changes
        auth.onAuthStateChanged(user => {
            if (user) {
                messageElement.innerHTML = `Welcome, ${user.email} (UID: ${user.uid})`;
                document.getElementById('signupButton').style.display = 'none';
                document.getElementById('signinButton').style.display = 'none';
                document.getElementById('googleSigninButton').style.display = 'none';
                document.getElementById('signOutButton').style.display = 'block';
            } else {
                messageElement.innerHTML = "No user signed in.";
                document.getElementById('signupButton').style.display = 'block';
                document.getElementById('signinButton').style.display = 'block';
                document.getElementById('googleSigninButton').style.display = 'block';
                document.getElementById('signOutButton').style.display = 'none';
            }
        });

        // --- Email/Password Sign Up ---
        document.getElementById('signupButton').addEventListener('click', () => {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Signed up successfully
                    messageElement.innerHTML = `Signed up successfully as ${userCredential.user.email}`;
                })
                .catch((error) => {
                    messageElement.innerHTML = `Sign Up Error: ${error.message}`;
                });
        });

        // --- Email/Password Sign In ---
        document.getElementById('signinButton').addEventListener('click', () => {
            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Signed in successfully
                    messageElement.innerHTML = `Signed in successfully as ${userCredential.user.email}`;
                })
                .catch((error) => {
                    messageElement.innerHTML = `Sign In Error: ${error.message}`;
                });
        });

        // --- Google Sign In (Popup method) ---
        document.getElementById('googleSigninButton').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    // This gives you a Google Access Token. You can use it to access the Google API.
                    const credential = result.credential;
                    const token = credential.accessToken;
                    // The signed-in user info.
                    const user = result.user;
                    messageElement.innerHTML = `Signed in with Google as ${user.displayName} (${user.email})`;
                }).catch((error) => {
                    // Handle Errors here.
                    messageElement.innerHTML = `Google Sign In Error: ${error.message}`;
                });
        });

        // --- Sign Out ---
        document.getElementById('signOutButton').addEventListener('click', () => {
            auth.signOut().then(() => {
                messageElement.innerHTML = "Signed out successfully.";
            }).catch((error) => {
                messageElement.innerHTML = `Sign Out Error: ${error.message}`;
            });
        });

    </script>
</body>
</html>
