<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie Pinterest Vue + Masonry</title>

<link rel="stylesheet" href="/style.css">

<!-- Vue 3 -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<!-- Masonry + imagesLoaded -->
<script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
<script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>

<style>
  /* Espaces pour header et footer */
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    background: #f5f5f5;
    padding: 0;
  }

  header {
    height: 80px; /* ajustable */
    background: #333;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  footer {
    height: 60px; /* ajustable */
    background: #333;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px;
    padding-top: 16px;
    padding-bottom: 16px;
  }

  .grid-item {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 8px;
    width: 100%;
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .grid-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    border-radius: 8px;
  }

  /* Zoom moins prononcé */
  .grid-item:hover img {
    transform: scale(1.02);
  }

  /* Largeur responsive des colonnes */
  @media (min-width: 0px) {
    .grid-item {
      width: calc(50% - 8px); /* 2 colonnes minimum */
    }
  }

  @media (min-width: 900px) {
    .grid-item {
      width: calc(33.333% - 8px); /* 3 colonnes max */
    }
  }
</style>
</head>
<body>

<header>
  <h1>Mon Header</h1>
</header>

<div id="app" class="container">
  <div class="grid" ref="grid">
    <div class="grid-item" v-for="(img, index) in images" :key="index">
      <img :src="img" loading="lazy">
    </div>
  </div>
</div>

<footer>
  <p>Mon Footer</p>
</footer>

<script>
const { createApp, onMounted, ref } = Vue;

createApp({
  setup() {
    const images = ref([]);
    const grid = ref(null);

    // Générer les images 42 → 1
    for (let i = 42; i >= 1; i--) {
      images.value.push(`creations/${i}.webp`);
    }

    onMounted(() => {
      const msnry = new Masonry(grid.value, {
        itemSelector: '.grid-item',
        columnWidth: '.grid-item',
        percentPosition: true,
        gutter: 8
      });

      imagesLoaded(grid.value, () => {
        msnry.layout();
      });

      // Re-layout après que chaque image se charge
      const imgs = grid.value.querySelectorAll('img');
      imgs.forEach(img => {
        img.addEventListener('load', () => {
          msnry.layout();
        });
      });
    });

    return { images, grid };
  }
}).mount('#app');
</script>
</body>
</html>
