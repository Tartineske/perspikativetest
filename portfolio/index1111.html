<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes créations — Portfolio</title>
  <meta name="description" content="Portfolio de créations artistiques" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: hsl(180 20% 98%);
      --fg: hsl(200 25% 10%);
      --card: hsl(180 15% 95%);
      --muted: hsl(200 10% 45%);
      --border: hsl(190 20% 88%);
      --gradient-hero: linear-gradient(135deg, hsl(210 65% 55%), hsl(185 50% 45%), hsl(160 50% 45%));
      --gradient-subtle: linear-gradient(135deg, hsl(210 65% 55% / 0.08), hsl(160 50% 45% / 0.08));
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --radius: 0.75rem;
    }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* ── Header ── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid hsl(190 20% 88% / 0.5);
      background: var(--gradient-subtle);
    }
    .site-header .inner {
      max-width: 80rem;
      margin: 0 auto;
      padding: 0 1rem;
      height: 4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-header .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--fg);
    }
    .site-header .logo-icon {
      width: 2rem;
      height: 2rem;
      border-radius: 0.5rem;
      background: var(--gradient-hero);
    }
    .site-header .logo-text {
      font-family: var(--font-heading);
      font-size: 1.125rem;
      font-weight: 600;
    }
    .site-header nav {
      display: flex;
      gap: 1.5rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .site-header nav a {
      text-decoration: none;
      color: inherit;
      transition: color 0.2s;
    }
    .site-header nav a:hover { color: var(--fg); }
    /* ── Page header ── */
    .page-header {
      max-width: 80rem;
      margin: 0 auto;
      padding: 2.5rem 1rem 1.5rem;
    }
    .page-header h1 {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 700;
      background: var(--gradient-hero);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .page-header p {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 1rem;
    }
    /* ── Masonry grid ── */
    .masonry {
      max-width: 80rem;
      margin: 0 auto;
      padding: 0 1rem 3rem;
      column-count: 3;
      column-gap: 1rem;
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--card);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .masonry-item:hover { transform: scale(1.02); }
    .masonry-item img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .lightbox.active { display: flex; }
    .lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: hsl(200 25% 10% / 0.8);
      backdrop-filter: blur(8px);
    }
    .lightbox img {
      position: relative;
      z-index: 1;
      max-width: 100%;
      max-height: 85vh;
      border-radius: 0.75rem;
      box-shadow: 0 25px 50px -12px hsl(0 0% 0% / 0.4);
      object-fit: contain;
    }
    /* ── Footer ── */
    .site-footer {
      margin-top: auto;
      border-top: 1px solid hsl(190 20% 88% / 0.5);
    }
    .site-footer .inner {
      max-width: 80rem;
      margin: 0 auto;
      padding: 2.5rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .site-footer .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .site-footer .brand-icon {
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 0.375rem;
      background: var(--gradient-hero);
    }
    .site-footer .brand-text {
      font-family: var(--font-heading);
      font-size: 0.875rem;
      font-weight: 500;
    }
    .site-footer .copy {
      font-size: 0.875rem;
      color: var(--muted);
    }
    .site-footer .links {
      display: flex;
      gap: 1.25rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .site-footer .links a {
      text-decoration: none;
      color: inherit;
      transition: color 0.2s;
    }
    .site-footer .links a:hover { color: var(--fg); }
    /* ── Responsive ── */
    @media (max-width: 768px) {
      .masonry { column-count: 2; }
      .page-header { padding: 2rem 1rem 1rem; }
      .page-header h1 { font-size: 1.75rem; }
    }
    @media (min-width: 768px) {
      .site-header .inner, .page-header, .masonry, .site-footer .inner {
        padding-left: 2rem;
        padding-right: 2rem;
      }
      .page-header { padding-top: 3.5rem; padding-bottom: 2rem; }
      .page-header h1 { font-size: 3rem; }
      .page-header p { font-size: 1.125rem; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="inner">
      <a href="/" class="logo">
        <div class="logo-icon"></div>
        <span class="logo-text">Galerie</span>
      </a>
      <nav>
        <a href="/portfolio/creations">Dessins</a>
        <a href="#">À propos</a>
        <a href="#">Contact</a>
      </nav>
    </div>
  </header>
  <!-- Page title -->
  <div class="page-header">
    <h1>Mes dessins</h1>
    <p>Collection personnelle</p>
  </div>
  <!-- Masonry grid (generated by JS) -->
  <section class="masonry" id="gallery"></section>
  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-backdrop"></div>
    <img id="lightbox-img" src="" alt="" />
  </div>
  <!-- Footer -->
  <footer class="site-footer">
    <div class="inner">
      <div class="brand">
        <div class="brand-icon"></div>
        <span class="brand-text">Galerie</span>
      </div>
      <p class="copy">&copy; 2026 — Tous droits réservés</p>
      <div class="links">
        <a href="#">Instagram</a>
        <a href="#">Twitter</a>
        <a href="#">Behance</a>
      </div>
    </div>
  </footer>
  <script>
    // ============================================================
    // 📝 CONFIGURATION
    // Nombre total d'images (de 42 à 1)
    // Les images doivent être dans /portfolio/creations/1.webp à 42.webp
    // ============================================================
    const TOTAL_IMAGES = 42;
    const BASE_PATH = '/portfolio/creations/';
    // Generate gallery
    const gallery = document.getElementById('gallery');
    for (let i = TOTAL_IMAGES; i >= 1; i--) {
      const div = document.createElement('div');
      div.className = 'masonry-item';
      div.onclick = () => openLightbox(BASE_PATH + i + '.webp', 'Création ' + i);
      const img = document.createElement('img');
      img.src = BASE_PATH + i + '.webp';
      img.alt = 'Création ' + i;
      img.loading = 'lazy';
      img.draggable = false;
      div.appendChild(img);
      gallery.appendChild(div);
    }
    // Lightbox
    function openLightbox(src, alt) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-img').alt = alt;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
