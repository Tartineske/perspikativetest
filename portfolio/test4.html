<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masonry Test — Perspikative Lab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: hsl(180 20% 98%);
      color: hsl(200 25% 10%);
      padding: 2rem 1rem;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 2rem;
      background: linear-gradient(135deg, #3b82f6, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .masonry {
      max-width: 80rem;
      margin: 0 auto;
    }

    .card {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #eee;
      position: relative;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Skeleton loader */
    .skeleton {
      width: 100%;
      height: 220px;
      background: linear-gradient(
        110deg,
        #e5e5e5 8%,
        #f3f3f3 18%,
        #e5e5e5 33%
      );
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
    }

    @keyframes shimmer {
      to { background-position-x: -200%; }
    }

    /* Fade-in when loaded */
    .loaded {
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <h1>Perspikative — Masonry Lab</h1>

  <div class="masonry" id="gallery"></div>

  <!-- Macy + imagesLoaded -->
  <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/macy@2"></script>

  <script>
    const TOTAL_IMAGES = 42;
    const BASE_PATH = "/portfolio/creations/";
    const gallery = document.getElementById("gallery");

    // Fake skeleton cards first
    for (let i = 0; i < TOTAL_IMAGES; i++) {
      const skel = document.createElement("div");
      skel.className = "card skeleton";
      gallery.appendChild(skel);
    }

    // Then load real images
    const images = [];

    for (let i = TOTAL_IMAGES; i >= 1; i--) {
      const div = document.createElement("div");
      div.className = "card";

      const img = document.createElement("img");
      img.src = `${BASE_PATH}${300 + i}/${350 + (i * 7)}`;
      img.loading = "lazy";
      img.style.opacity = 0;

      img.onload = () => {
        img.classList.add("loaded");
        img.style.opacity = 1;
      };

      div.appendChild(img);
      images.push(div);
    }

    // Replace skeletons with real images
    setTimeout(() => {
      gallery.innerHTML = "";
      images.forEach(el => gallery.appendChild(el));

      imagesLoaded(gallery, () => {
        new Macy({
          container: "#gallery",
          trueOrder: true,
          waitForImages: true,
          margin: 16,
          columns: 3,
          breakAt: {
            768: 2,
            480: 1
          }
        });
      });

    }, 600);
  </script>

</body>

</html>
