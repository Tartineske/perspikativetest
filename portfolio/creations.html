    <style>
        /* --- CSS DE LA GALERIE --- */
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Conteneur principal de la galerie */
        .masonry-gallery {
            display: flex;
            justify-content: center;
            gap: 20px; /* Espace entre les colonnes */
            max-width: 1200px;
            margin: 0 auto;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        /* Les colonnes verticales */
        .masonry-column {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Espace vertical entre les images dans une colonne */
            flex: 1; /* Chaque colonne prend une part égale */
        }

        /* Carte individuelle (Image + Titre) */
        .masonry-art-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            break-inside: avoid;
        }

        .masonry-art-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.15);
        }

        .masonry-art-card img {
            width: 100%;
            height: auto;
            display: block;
            background-color: #eee; /* Couleur de fond pendant le chargement */
        }

        .art-info {
            padding: 15px;
        }

        .art-info h3 {
            margin: 0;
            font-size: 1rem;
            color: #222;
        }

        .art-info p {
            margin: 5px 0 0;
            font-size: 0.85rem;
            color: #666;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .masonry-gallery {
                gap: 15px;
                margin: 30px 20px 50px 20px;
            }
        }

        @media (min-width: 769px) {
            .masonry-gallery {
                gap: 25px;
            }
        }
    </style>
</head>

        ];

        const MasonryGallery = () => {
            const [columns, setColumns] = useState([[], [], []]);

            const distributeImages = () => {
                const isMobile = window.innerWidth <= 768;
                const numColumns = isMobile ? 2 : 3;
                const newColumns = Array.from({ length: numColumns }, () => []);

                // Distribution cyclique pour répartir les images
                rawImages.forEach((image, index) => {
                    const targetColumnIndex = index % numColumns;
                    newColumns[targetColumnIndex].push(image);
                });

                setColumns(newColumns);
            };

            useEffect(() => {
                distributeImages();
                window.addEventListener('resize', distributeImages);
                return () => window.removeEventListener('resize', distributeImages);
            }, []);

            return (
                <div>
                    <div className="masonry-gallery">
                        {columns.map((col, index) => (
                            <div key={index} className="masonry-column">
                                {col.map((img) => (
                                    <div key={img.id} className="masonry-art-card">
                                        <img src={img.url} alt={img.title} loading="lazy" />
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MasonryGallery />);
    </script>
