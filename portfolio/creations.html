  <script>
    // SCRIPT MASONRY PUISSANT
    function doMasonry() {
      const grid = document.getElementById('masonry-grid');
      const items = grid.getElementsByClassName('prspk-thumb');
      if (!grid || items.length === 0) return;

      const windowWidth = window.innerWidth;
      const columns = windowWidth >= 1024 ? 3 : 2; // 3 sur desktop, 2 sur mobile
      const gap = windowWidth >= 1024 ? 25 : 15;   // Espace entre images
      
      const colHeights = new Array(columns).fill(0);
      const containerWidth = grid.offsetWidth;
      const itemWidth = (containerWidth - (gap * (columns - 1))) / columns;

      for (let item of items) {
        item.style.width = itemWidth + 'px';
        
        // On trouve la colonne la plus courte
        let minHeight = Math.min(...colHeights);
        let colIndex = colHeights.indexOf(minHeight);
        
        let x = colIndex * (itemWidth + gap);
        let y = minHeight;
        
        item.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        
        // On ajoute la hauteur de l'image + le gap à la colonne
        colHeights[colIndex] += item.getBoundingClientRect().height + gap;
      }
      
      // On ajuste la hauteur du parent car les enfants sont "sortis" du flux
      grid.style.height = Math.max(...colHeights) + 'px';
    }

    // Gestion du chargement
    window.addEventListener('load', doMasonry);
    window.addEventListener('resize', doMasonry);
    
    // Lightbox habituelle
    const thumbs = document.querySelectorAll('.prspk-thumb');
    thumbs.forEach(img => {
      img.addEventListener('click', () => {

         console.log("Ouverture de : " + img.dataset.title);
      });
    });
  </script>
