  <style>
    /* ── Page header ── */
    .page-header {
      max-width: 80rem;
      margin: 0 auto;
      padding: 2.5rem 1rem 1.5rem;
    }

    .page-header h1 {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 700;
      background: var(--gradient-hero);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Masonry Layout ── */
    .masonry {
      max-width: 80rem;
      margin: 0 auto;
      padding: 0 1rem 3rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: masonry;
      gap: 1rem;
    }

    .masonry-item {
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--card);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .masonry-item:hover { transform: scale(1.02); }

    .masonry-item img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    /* ── Fallback Firefox ── */
    @supports not (grid-template-rows: masonry) {
      .masonry {
        column-count: 3;
        column-gap: 1rem;
        display: block;
      }

      .masonry-item {
        break-inside: avoid;
        margin-bottom: 1rem;
        border-radius: 10px;
      }

      @media (max-width: 768px) {
        .masonry {
          column-count: 2;
        }
      }
    }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .lightbox.active { display: flex; }

    .lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: hsl(200 25% 10% / 0.8);
      backdrop-filter: blur(8px);
    }

    .lightbox img {
      position: relative;
      z-index: 1;
      max-width: 100%;
      max-height: 85vh;
      border-radius: 0.75rem;
      box-shadow: 0 25px 50px -12px hsl(0 0% 0% / 0.4);
      object-fit: contain;
    }

    /* ── Footer ── */
    .site-footer {
      margin-top: auto;
      border-top: 1px solid hsl(190 20% 88% / 0.5);
    }

    .site-footer .inner {
      max-width: 80rem;
      margin: 0 auto;
      padding: 2.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-icon {
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 0.375rem;
      background: var(--gradient-hero);
    }

    .brand-text {
      font-family: var(--font-heading);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .copy {
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .masonry {
        grid-template-columns: repeat(2, 1fr);
      }

      .page-header h1 {
        font-size: 1.75rem;
      }
    }

    @media (min-width: 768px) {
      .site-header .inner,
      .page-header,
      .masonry,
      .site-footer .inner {
        padding-left: 2rem;
        padding-right: 2rem;
      }

      .page-header h1 {
        font-size: 3rem;
      }
    }
  </style>
</head>

  <script>
    const TOTAL_IMAGES = 42;
    const BASE_PATH = '/portfolio/creations/';

    const gallery = document.getElementById('gallery');

    for (let i = TOTAL_IMAGES; i >= 1; i--) {
      const div = document.createElement('div');
      div.className = 'masonry-item';
      div.onclick = () => openLightbox(BASE_PATH + i + '.webp', 'Création ' + i);

      const img = document.createElement('img');
      img.src = BASE_PATH + i + '.webp';
      img.alt = 'Création ' + i;
      img.loading = 'lazy';
      img.draggable = false;

      div.appendChild(img);
      gallery.appendChild(div);
    }

    function openLightbox(src, alt) {
      const img = document.getElementById('lightbox-img');
      img.src = src;
      img.alt = alt;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

    menuToggle.addEventListener('change', (e) => {
