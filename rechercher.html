    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('searchResults');
    const historyContainer = document.getElementById('searchHistory');
    const SEARCH_HISTORY_KEY = 'perspikativeSearchHistory';
    const SEARCH_HISTORY_MAX = 5;

    function escapeHtml(value) {
      return value
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function getSearchHistory() {
      try {
        const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function setSearchHistory(history) {
      localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(history.slice(0, SEARCH_HISTORY_MAX)));
    }

    function addSearchToHistory(term) {
      const cleanedTerm = term.trim();
      if (cleanedTerm.length < 2) return;

      const lowerTerm = cleanedTerm.toLowerCase();
      const history = getSearchHistory().filter(item => item.toLowerCase() !== lowerTerm);
      history.unshift(cleanedTerm);
      setSearchHistory(history);
      renderSearchHistory();
    }

    function clearSearchHistory() {
      localStorage.removeItem(SEARCH_HISTORY_KEY);
      renderSearchHistory();
    }

    function renderSearchHistory() {
      const history = getSearchHistory();

      if (history.length === 0) {
        historyContainer.innerHTML = '';
        return;
      }

      const historyItems = history.map(term => `
        <button type="button" class="history-item" data-term="${encodeURIComponent(term)}">
          <img src="/icons/rechercher.svg" alt="" class="history-icon" aria-hidden="true">
          <span>${escapeHtml(term)}</span>
        </button>
      `).join('');

      historyContainer.innerHTML = `
        <div class="history-title">Historique des recherches</div>
        <div class="history-list">${historyItems}</div>
        <button type="button" class="clear-history-btn" id="clearHistoryBtn">Effacer l'historique</button>
      `;

      historyContainer.querySelectorAll('.history-item').forEach(button => {
        button.addEventListener('click', () => {
          const term = decodeURIComponent(button.dataset.term || '');
          searchInput.value = term;
          performSearch(term);
          addSearchToHistory(term);
          searchInput.focus();
        });
      });

      const clearButton = document.getElementById('clearHistoryBtn');
      if (clearButton) {
        clearButton.addEventListener('click', clearSearchHistory);
      }
    }

    function performSearch(rawQuery) {
      const query = rawQuery.toLowerCase().trim();
      resultsContainer.innerHTML = '';

      // Easter egg
      if (easterEggs[query]) {
        const egg = easterEggs[query];
        let html = `<div class="easter-egg">`;

        if (egg.img) html += `<img src="${egg.img}" alt="Easter egg">`;
        if (egg.text) html += `<p>${egg.text}</p>`;

        html += `</div>`;
        resultsContainer.innerHTML = html;
        return;
      }

      if (query.length < 2) return;

      const results = siteContent.filter(item => {
        return item.title.toLowerCase().includes(query) ||
               item.tags.toLowerCase().includes(query) ||
               item.category.toLowerCase().includes(query);
      });

      if (results.length === 0) {
        resultsContainer.innerHTML = `<div style="color:white; text-align:center; opacity:0.7;">Aucun résultat pour "${escapeHtml(rawQuery)}"</div>`;
      } else {
        results.forEach(item => {
          const imageSrc = item.img ? item.img : 'icons/rechercher.svg';

          const html = `
            <a href="${item.url}" class="result-item">
              <img src="${imageSrc}" alt="miniature" class="result-thumb">
              <div class="result-info">
                <h3>${item.title} <span class="badge-cat">${item.category}</span></h3>
                <p>Mots-clés : ${item.tags.substring(0, 40)}...</p>
              </div>
            </a>
          `;
          resultsContainer.innerHTML += html;
        });
      }
    }

    searchInput.addEventListener('input', function(e) {
      performSearch(e.target.value);
    });

    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        addSearchToHistory(e.target.value);
      }
    });

    searchInput.addEventListener('blur', function(e) {
      addSearchToHistory(e.target.value);
    });

    renderSearchHistory();

    // --- 3. MENU MOBILE ---
    const menuToggle = document.getElementById('menuToggle');
    menuToggle.addEventListener('change', (e) => {
      document.body.classList.toggle('menu-open', e.target.checked);
    });
  </script>

  <script src="/script.js"></script>
</body>

</html>
