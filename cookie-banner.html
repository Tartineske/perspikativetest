<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Exemple Consentement Cookies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      padding: 2rem;
    }

    /* Bannière */
    .cookie-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      padding: 1.5rem;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .cookie-buttons {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
    }

    button {
      flex: 1;
      padding: 0.7rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .accept {
      background: #4CAF50;
      color: white;
    }

    .reject {
      background: #444;
      color: white;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #1a1a1a;
    }

    .change-consent {
      color: #aaa;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>

<body>

<main>
  <h1>Bienvenue sur mon site</h1>
  <p>Google Analytics ne se chargera qu'après consentement.</p>
</main>

<div class="cookie-banner" id="cookieBanner">
  <strong>Ce site utilise des cookies de mesure d’audience.</strong>
  <p>Vous pouvez accepter ou refuser l’utilisation de Google Analytics.</p>

  <div class="cookie-buttons">
    <button class="accept" onclick="acceptCookies()">Accepter</button>
    <button class="reject" onclick="rejectCookies()">Refuser</button>
  </div>
</div>

<footer>
  <span class="change-consent" onclick="resetConsent()">
    Modifier mes préférences cookies
  </span>
</footer>

<script>
  const banner = document.getElementById("cookieBanner");

  function loadAnalytics() {
    const script = document.createElement("script");
    script.async = true;
    script.src = "https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"; // Remplace par ton ID
    document.head.appendChild(script);

    script.onload = () => {
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX'); // Remplace par ton ID
    };
  }

  function acceptCookies() {
    localStorage.setItem("cookieConsent", "accepted");
    banner.style.display = "none";
    loadAnalytics();
  }

  function rejectCookies() {
    localStorage.setItem("cookieConsent", "rejected");
    banner.style.display = "none";
  }

  function resetConsent() {
    localStorage.removeItem("cookieConsent");
    location.reload();
  }

  // Vérifie le choix au chargement
  const consent = localStorage.getItem("cookieConsent");

  if (!consent) {
    banner.style.display = "block";
  } else if (consent === "accepted") {
    loadAnalytics();
  }
</script>

</body>
</html>
